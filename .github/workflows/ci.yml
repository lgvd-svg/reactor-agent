name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv --python 3.12 .venv
          . .venv/bin/activate
          uv pip install -e ".[dev]"
      - name: Lint
        run: . .venv/bin/activate && ruff check reactor_agent tests
      - name: Test (offline; no LLM calls)
        run: . .venv/bin/activate && JAX_PLATFORMS=cpu pytest -q
